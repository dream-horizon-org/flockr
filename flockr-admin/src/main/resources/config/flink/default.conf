  # Flink cluster host
  host = "localhost"
  host = ${?FLINK_HOST}

  # Flink REST API port
  port = 8081
  port = ${?FLINK_PORT}

  # Connection timeout in milliseconds
  connectTimeout = 30000
  connectTimeout = ${?FLINK_CONNECT_TIMEOUT}

  # Request timeout in milliseconds
  requestTimeout = 60000
  requestTimeout = ${?FLINK_REQUEST_TIMEOUT}

  # Maximum connection pool size
  maxPoolSize = 16
  maxPoolSize = ${?FLINK_MAX_POOL_SIZE}

  # Log HTTP activity
  logActivity = true
  logActivity = ${?FLINK_LOG_ACTIVITY}

  # Keep-alive for connections
  keepAlive = true
  keepAlive = ${?FLINK_KEEP_ALIVE}

  # Keep-alive timeout in seconds
  keepAliveTimeout = 60
  keepAliveTimeout = ${?FLINK_KEEP_ALIVE_TIMEOUT}

  # Savepoint polling interval in milliseconds
  savepointPollInterval = 2000
  savepointPollInterval = ${?FLINK_SAVEPOINT_POLL_INTERVAL}

  # Maximum number of savepoint polling retries
  savepointMaxRetries = 30
  savepointMaxRetries = ${?FLINK_SAVEPOINT_MAX_RETRIES}

