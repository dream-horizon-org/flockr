# Spark REST API configuration
host = ${SPARK_HOST}
port = 6066
connectTimeout = 30000
requestTimeout = 60000
maxRetries = 3

# Job submission settings
masterUrl = ${SPARK_MASTER_URL}
jarPath = ${SPARK_JAR_PATH}
deployMode = "cluster"
executorMemory = "2g"
executorCores = 2
executorInstances = 2
driverMemory = "1g"
