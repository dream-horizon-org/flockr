# Development docker-compose override
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  flockr-admin:
    environment:
      # Enable Java debugging
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Xms512m -Xmx1024m -XX:+UseG1GC
    ports:
      - "5005:5005"  # Debug port
    volumes:
      # Mount local resources for hot reload (if needed)
      - ./flockr-admin/src/main/resources:/app/resources:ro
      # Mount logs directory
      - ./logs:/app/logs

  # Add PGAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flockr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flockr.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - flockr-network
