name: Docker Build and Test

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  docker-build:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: flockr-admin:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      
      - name: Start Docker Compose services
        run: |
          cp env.docker .env
          docker-compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30
      
      - name: Check service health
        run: |
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:8080/health; then
              echo "✅ Application is healthy"
              break
            fi
            attempt=$((attempt + 1))
            echo "⏳ Waiting for application... ($attempt/$max_attempts)"
            sleep 5
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Application failed to become healthy"
            docker-compose logs flockr-admin
            exit 1
          fi
      
      - name: Run API smoke tests
        run: |
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          # Test API endpoints (add more as needed)
          echo "✅ Basic health checks passed"
      
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Services ==="
          docker-compose ps
          echo ""
          echo "=== Application Logs ==="
          docker-compose logs flockr-admin
          echo ""
          echo "=== PostgreSQL Logs ==="
          docker-compose logs postgres
      
      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v
      
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  docker-security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build image for scanning
        run: docker build -t flockr-admin:scan .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'flockr-admin:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

