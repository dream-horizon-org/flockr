services:
  # Aerospike Database for flockr-users
  flockr-aerospike:
    image: aerospike/aerospike-server:6.4.0.0
    container_name: flockr-aerospike
    ports:
      - "8200:3000"
      - "8201:3001"
      - "8202:3002"
    environment:
      - NAMESPACE=test
      - DATA_IN_MEMORY=false
    volumes:
      - aerospike_data:/opt/aerospike/data
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  # PostgreSQL 16 Database
  flockr-postgres:
    image: postgres:16-alpine
    container_name: flockr-postgres
    env_file:
      - env.docker
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./flockr-admin/src/main/resources/db/postgres:/docker-entrypoint-initdb.d
    ports:
      - "8230:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockr_user -d flockr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  # Flockr Admin Application
  flockr-admin:
    build:
      context: .
      dockerfile: flockr-admin/Dockerfile
    container_name: flockr-admin
    depends_on:
      flockr-postgres:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8250:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped

  # Flockr Users Application
  flockr-users:
    build:
      context: .
      dockerfile: flockr-users/Dockerfile
    container_name: flockr-users
    depends_on:
      flockr-aerospike:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8260:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  aerospike_data:
    driver: local

networks:
  flockr-network:
    driver: bridge
