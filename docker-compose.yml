services:
  # Aerospike Database for flockr-users
  flockr-aerospike:
    image: aerospike/aerospike-server:6.4.0.0
    container_name: flockr-aerospike
    ports:
      - "8200:3000"
      - "8201:3001"
      - "8202:3002"
    environment:
      - NAMESPACE=test
      - DATA_IN_MEMORY=false
    volumes:
      - aerospike_data:/opt/aerospike/data
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  # PostgreSQL 16 Database
  flockr-postgres:
    image: postgres:16-alpine
    container_name: flockr-postgres
    env_file:
      - env.docker
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./flockr-admin/src/main/resources/db/postgres:/docker-entrypoint-initdb.d
    ports:
      - "8230:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockr_user -d flockr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  # Flockr Admin Application
  flockr-admin:
    build:
      context: .
      dockerfile: flockr-admin/Dockerfile
    container_name: flockr-admin
    depends_on:
      flockr-postgres:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8250:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped

  # Flockr Users Application
  flockr-users:
    build:
      context: .
      dockerfile: flockr-users/Dockerfile
    container_name: flockr-users
    depends_on:
      flockr-aerospike:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8260:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped


  # Spark Master
  spark-master:
    image: bitnami/spark:latest
    hostname: spark-master
    container_name: spark-master
    ports:
      - "8080:8080"  # Spark Web UI
      - "7077:7077"  # Spark Master port
      - "4040:4040"  # Spark Application UI
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - flockr-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spark Worker
  spark-worker:
    image: bitnami/spark:latest
    hostname: spark-worker
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"  # Spark Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - flockr-network

  # Init container: builds & copies Spark JAR
  spark-jar-init:
    build:
      context: .
      dockerfile: flockr-historic-engine/Dockerfile
    image: flockr-historic-engine-jar:latest
    container_name: spark-jar-init
    volumes:
      - spark:/shared
    command: >
      sh -c "cp /jars/flockr-historic-engine.jar /shared/"
    restart: "no"

volumes:
  postgres_data:
    driver: local
  aerospike_data:
    driver: local
  spark:
    driver: local

networks:
  flockr-network:
    driver: bridge