services:
  # Aerospike Database for flockr-users
  aerospike:
    image: aerospike/aerospike-server:6.4.0.0
    container_name: flockr-aerospike
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    environment:
      - NAMESPACE=test
      - DATA_IN_MEMORY=true
    volumes:
      - aerospike_data:/opt/aerospike/data
    healthcheck:
      test: ["CMD", "asinfo", "-v", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  spark-master:
    image: apache/spark:3.5.3
    container_name: flockr-spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - '8090:8080'   # Spark Master Web UI
      - '7077:7077'   # Spark Master RPC port for workers
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - flockr-network

  spark-worker:
    image: apache/spark:3.5.3
    container_name: flockr-spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - '8091:8081'   # Spark Worker Web UI
    networks:
      - flockr-network

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: flockr-postgres
    env_file:
      - env.docker
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./flockr-admin/src/main/resources/db/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flockr_user -d flockr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flockr-network

  # Apache Flink 1.17 JobManager
  flink-jobmanager:
    image: flink:1.17.2
    container_name: flockr-flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    ports:
      - "8081:8081"
    command: jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - flockr-network

  # Apache Flink 1.17 TaskManager
  flink-taskmanager:
    image: flink:1.17.2
    container_name: flockr-flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
    command: taskmanager
    scale: 1
    networks:
      - flockr-network

  # Flockr Admin Application
  flockr-admin:
    build:
      context: .
      dockerfile: flockr-admin/Dockerfile
    container_name: flockr-admin
    depends_on:
      postgres:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped

  # Flockr Users Application
  flockr-users:
    build:
      context: .
      dockerfile: flockr-users/Dockerfile
    container_name: flockr-users
    depends_on:
      aerospike:
        condition: service_healthy
    env_file:
      - env.docker
    ports:
      - "8082:8082"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - flockr-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  aerospike_data:
    driver: local

networks:
  flockr-network:
    driver: bridge
